<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монгол хэлний таталт тоглоом</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1 id="ruleLabel">Монгол хэлний зөв бичих дүрэм</h1>
    <h2 id="questionText">Асуулт ачааллаж байна...</h2>
    <p id="statusText">Хэн түрүүлж зөв хариулах вэ?</p>

    <div class="game-area">
      <div class="center-line"></div>
      <div id="ropeGroup" class="rope-group">
        <img src="assets/tug-war.png" alt="Таталт тоглоом" class="tug-image" />
      </div>
    </div>

    <div class="teams">
      <div class="team-box">
        <h3>Баг 1</h3>
        <div id="leftAnswers" class="answers"></div>
      </div>

      <div class="team-box">
        <h3>Баг 2</h3>
        <div id="rightAnswers" class="answers"></div>
      </div>
    </div>

    <button id="restartBtn">Дахин эхлүүлэх</button>
  </div>

  <script src="script.js?v=40"></script>
</body>
</html>
