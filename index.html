<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Олс таталт - Гээгдэх эгшгийн дүрэм</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Тоглоомын дүрэм ба асуултын хэсэг -->
  <div id="ruleLabel">Гээгдэх эгшгийн дүрэм</div>
  <div id="questionText">Асуулт ачаалж байна...</div>
  <div id="statusText"></div>

  <!-- Олс таталтын талбай -->
  <div class="game-area">
    <div class="center-line"></div>
    <div id="ropeGroup">
      <!-- Олс болон олс татаж буй багуудын дүрс/зураг -->
      <img src="tug-of-war.png" alt="Олс таталт" class="tug-image" onerror="this.style.display='none'">
    </div>
  </div>

  <!-- Багуудын хариулах талбар -->
  <div class="teams">
    <div>
      <h3>Баг 1 (Зүүн)</h3>
      <div id="leftAnswers"></div>
    </div>
    <div>
      <h3>Баг 2 (Баруун)</h3>
      <div id="rightAnswers"></div>
    </div>
  </div>

  <!-- Дахин эхлүүлэх товчлуур -->
  <div>
    <button id="restartBtn">Дахин тоглох</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
